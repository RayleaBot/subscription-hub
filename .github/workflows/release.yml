name: plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RAYLEABOT_SDK_REF: sdk/go/v0.2.0
  GO_VERSION: 1.25.12
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.11.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout pinned RayleaBot SDK
        uses: actions/checkout@v4
        with:
          repository: RayleaBot/RayleaBot
          ref: ${{ env.RAYLEABOT_SDK_REF }}
          path: .rayleabot/core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup pnpm
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Link checked-out SDKs
        shell: bash
        run: |
          set -euo pipefail
          cat > go.work <<EOF
          go ${GO_VERSION}

          use (
            .
            ./.rayleabot/core/sdk/go
          )
          EOF
          if [ -f ui/package.json ]; then
            mkdir -p .rayleabot/sdk
            cp -R .rayleabot/core/sdk/vue .rayleabot/sdk/vue
          fi

      - name: Test Go plugin
        run: go test -race ./...

      - name: Test Vue management UI
        if: ${{ hashFiles('ui/package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui typecheck
          pnpm --dir ui test
          pnpm --dir ui build

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, linux-x64, macos-arm64]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout pinned RayleaBot SDK
        uses: actions/checkout@v4
        with:
          repository: RayleaBot/RayleaBot
          ref: ${{ env.RAYLEABOT_SDK_REF }}
          path: .rayleabot/core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup pnpm
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Link checked-out SDKs
        shell: bash
        run: |
          set -euo pipefail
          cat > go.work <<EOF
          go ${GO_VERSION}

          use (
            .
            ./.rayleabot/core/sdk/go
          )
          EOF
          if [ -f ui/package.json ]; then
            mkdir -p .rayleabot/sdk
            cp -R .rayleabot/core/sdk/vue .rayleabot/sdk/vue
          fi

      - name: Build signed-catalog artifact input
        env:
          RAYLEA_PLUGIN_BUILD_USE_WORKSPACE: '1'
        run: go run ./tools/build -target "${{ matrix.target }}" -out dist

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --generate-notes --verify-tag
